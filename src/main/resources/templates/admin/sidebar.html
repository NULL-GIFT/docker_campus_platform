<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="sidebar(activeUri)" class="admin-sidebar">

  <style>
    /* === 侧边栏整体风格：改为轻盈白底 === */
    .admin-layout { display: flex; min-height: 100vh; background: #fdfcf8; }

    .admin-sidebar {
      width: 260px;
      background: #ffffff; /* 改为纯白或极淡的米白 */
      color: #2d3748;      /* 字体改为深灰 */
      flex-shrink: 0;
      display: flex; flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.03); /* 阴影变得更柔和 */
      border-right: 1px solid #cbd5e0;
      z-index: 10;
    }

    /* === 头部：复刻首页的橙色渐变卡片 === */
    .sidebar-header {
      margin: 20px; /* 留出边距，做成悬浮卡片感 */
      padding: 25px 20px;
      border-radius: 16px;
      /* 使用首页同款渐变 */
      background: linear-gradient(135deg, #fae8d3 0%, #face94 100%);
      color: #2d3748;
      box-shadow: 0 10px 20px -5px rgba(250, 206, 148, 0.4); /* 橙色系的投影 */
      display: flex; align-items: center;
      font-weight: bold; font-size: 18px; letter-spacing: 0.5px;
    }
    .sidebar-header i { margin-right: 10px; color: #c05621; font-size: 20px; }

    /* === 菜单列表 === */
    .sidebar-menu { list-style: none; padding: 10px 15px; margin: 0; flex: 1; }
    .sidebar-menu li { margin-bottom: 8px; }

    .sidebar-menu a {
      display: flex; align-items: center;
      padding: 12px 20px;
      color: #2d3748; /* 默认浅灰 */
      text-decoration: none;
      border-radius: 12px; /* 圆角矩形 */
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-weight: 500;
      font-size: 14px;
    }

    .sidebar-menu a i {
      color: #718096;
      width: 25px; font-size: 16px; text-align: center; margin-right: 5px;
      transition: transform 0.3s;
    }

    /* 悬停状态 */
    .sidebar-menu a:hover {
      background: #fffaf0; /* 极淡的橙色背景 */
      color: #dd6b20;
      transform: translateX(3px);
    }
    .sidebar-menu a:hover i { transform: scale(1.1); }

    /* === 激活状态 (Active) === */
    .sidebar-menu a.active {
      background: #fff5f5; /* 类似首页“管理后台”模块的背景色 */
      color: #c53030;      /* 深砖红色 */
      font-weight: bold;
      box-shadow: 0 2px 10px rgba(252, 129, 129, 0.1);
    }
    .sidebar-menu a.active i { color: #fc8181; }

    /* === 底部区域 === */
    .sidebar-footer {
      padding: 20px;
      /* 上方的虚线也加深 */
      border-top: 1px dashed #cbd5e0;
    }

    .btn-logout {
      display: block;
      /* 👇 关键：加上左右边距，不再傻傻地撑满 */
      margin: 0 10px;
      padding: 10px 0; /* 上下留白 */

      /* 👇 样式整容：白底、红边、红字 */
      background: #fff;
      border: 1px solid #fc8181;
      color: #e53e3e;

      text-align: center;
      border-radius: 50px; /* 变成圆润的胶囊形 */
      text-decoration: none;
      transition: all 0.3s;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 5px rgba(252, 129, 129, 0.15);
    }

    .btn-logout:hover {
      background: #e53e3e;
      color: white;
      box-shadow: 0 4px 10px rgba(229, 62, 62, 0.3);
      transform: translateY(-2px); /* 悬浮微动 */
    }

    /* 统一内容区样式修正 */
    .admin-content {
      flex: 1; padding: 40px; overflow-y: auto;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>

  <div class="sidebar-header">
    <i class="fa fa-cube"></i>
    <span>管理控制台</span>
  </div>

  <ul class="sidebar-menu">

    <li>
      <a th:href="@{/admin/dashboard}" th:class="${activeUri == 'dashboard' ? 'active' : ''}">
        <i class="fa fa-tachometer"></i> 数据驾驶舱
      </a>
    </li>

    <li>
      <a th:href="@{/admin/users}" th:class="${activeUri == 'users' ? 'active' : ''}">
        <i class="fa fa-users"></i> 用户管理
      </a>
    </li>

    <li>
      <a th:href="@{/admin/items}" th:class="${activeUri == 'items' ? 'active' : ''}">
        <i class="fa fa-shopping-bag"></i> 商品管理
      </a>
    </li>

    <li>
      <a th:href="@{/admin/tasks}" th:class="${activeUri == 'tasks' ? 'active' : ''}">
        <i class="fa fa-tasks"></i> 任务管理
      </a>
    </li>

    <li>
      <a th:href="@{/admin/notice/publish}" th:class="${activeUri == 'notice' ? 'active' : ''}">
        <i class="fa fa-bullhorn"></i> 发布公告
      </a>
    </li>

    <li>
      <a th:href="@{/admin/logs}" th:class="${activeUri == 'logs' ? 'active' : ''}">
        <i class="fa fa-list-alt"></i> 系统日志
      </a>
    </li>

    <li style="margin: 20px 0 10px 0; border-top: 1px solid #cbd5e0;"></li>

    <li>
      <a th:href="@{/}" target="_blank">
        <i class="fa fa-external-link"></i> 前往校园服务大厅
      </a>
    </li>

  </ul>

  <div class="sidebar-footer">
    <a href="/auth/logout" class="btn-logout">
      <i class="fa fa-sign-out"></i> 安全退出
    </a>
  </div>

</nav>

</body>
</html>

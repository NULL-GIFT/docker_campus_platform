<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功 - 校园生活平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        :root {
            --bg-color: #fcfdfc;
            --text-main: #2c3e50;
            --vital-green-primary: #42b983;
            --vital-gradient-green: linear-gradient(135deg, #42b983 0%, #2ecc71 100%);
            --shadow-soft: 0 8px 20px rgba(66, 185, 131, 0.15);
        }

        body {
            background-color: var(--bg-color);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: white;
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-circle {
            width: 80px; height: 80px;
            background: var(--vital-gradient-green);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px rgba(66, 185, 131, 0.4);
        }

        .btn-edu {
            background: var(--vital-gradient-green);
            color: white; border: none; border-radius: 14px;
            padding: 12px 30px; font-weight: 600;
            text-decoration: none; display: block; width: 100%;
            transition: all 0.3s ease; margin-bottom: 12px;
        }
        .btn-edu:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(66, 185, 131, 0.4); color: white; }

        .btn-outline-edu {
            background: white; color: var(--text-main);
            border: 1px solid #e0e0e0; border-radius: 14px;
            padding: 12px 30px; font-weight: 600;
            text-decoration: none; display: block; width: 100%;
            transition: all 0.3s ease;
        }
        .btn-outline-edu:hover { background: #f8f9fa; border-color: #d1d1d1; color: var(--text-main); }

        h1 { font-weight: 800; font-size: 1.8rem; margin-bottom: 10px; }
        .success-msg { color: var(--vital-green-primary); font-weight: 500; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-check-lg" viewBox="0 0 16 16" style="color: white;">
            <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022Z"/>
        </svg>
    </div>

    <h1>支付成功！</h1>
    <p class="success-msg">恭喜您，交易已完成，商品已归您。</p>

    <div style="margin-top: 30px;">
        <a href="/order/my_orders" class="btn-edu">查看我的订单</a>
        <a href="/market/list" class="btn-outline-edu">继续逛逛</a>
    </div>
</div>

</body>
</html>

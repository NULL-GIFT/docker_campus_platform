spring:
  profiles:
    #默认激活开发环境
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  data:
    redis:
      database: 0

  #session放进redis
  session:
    store-type: redis
    redis:
      namespace: "campus:session"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus_platform.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.campus_platform.mapper: DEBUG